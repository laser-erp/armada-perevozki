name: Publish web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web-preview/**"
      - ".github/workflows/publish-web.yml"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish web-preview → laser-erp/armada-web
        env:
          TOKEN: ${{ secrets.ARMADA_WEB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "Missing secret ARMADA_WEB_TOKEN (PAT with push to laser-erp/armada-web)"
            exit 1
          fi
          rm -rf /tmp/armada-web-publish
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/laser-erp/armada-web.git" /tmp/armada-web-publish
          rsync -a --delete \
            --exclude '.git' \
            --exclude 'README.md' \
            web-preview/ /tmp/armada-web-publish/
          touch /tmp/armada-web-publish/.nojekyll
          cd /tmp/armada-web-publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No web changes to publish"
            exit 0
          fi
          git commit -m "Sync web-preview from armada-perevozki@${GITHUB_SHA::7}"
          git push origin HEAD:main
