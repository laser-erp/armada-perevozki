<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>АРМАДА — учёт перевозок</title>
  <style>
    :root {
      --bg0:#000; --bg1:#1e1e1e; --accent:#e61a1f; --bot:#2e2e2e;
      --text:#f5f5f5; --muted:rgba(245,245,245,.72); --field:rgba(255,255,255,.1); --ink:#111;
    }
    *{box-sizing:border-box} html,body{margin:0;height:100%;font-family:"Segoe UI","Trebuchet MS",sans-serif;background:#000;color:var(--text)}
    .phone{max-width:430px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:linear-gradient(160deg,var(--bg0),var(--bg1));position:relative}
    .phone.wide{max-width:100%}
    .screen{position:absolute;inset:0;display:none;flex-direction:column;background:linear-gradient(160deg,var(--bg0),var(--bg1))}
    .screen.show{display:flex}
    /* Полноэкранные панели внутри водителя — поверх чата */
    .driver-panel{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;background:linear-gradient(160deg,var(--bg0),var(--bg1))}
    .driver-panel.show{display:flex}
    .driver-panel header{background:rgba(0,0,0,.92);position:sticky;top:0;z-index:2}
    .driver-panel .panel-body{background:transparent;flex:1;min-height:0}
    .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
    .logo{width:120px;height:auto}
    .brand{font-size:2rem;font-weight:800;letter-spacing:.25em}
    .sub{color:var(--muted)}
    button.primary,button.secondary{width:100%;border:0;border-radius:16px;padding:14px 12px;font-size:1rem;font-weight:700;cursor:pointer}
    button.primary{background:var(--accent);color:#fff}
    button.secondary{background:var(--field);color:var(--text)}
    .stack{width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px}
    header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.1);gap:8px;flex-wrap:wrap}
    header h1{margin:0;font-size:1.05rem}
    header button{background:0;border:0;color:var(--accent);font-weight:700;cursor:pointer;white-space:nowrap}
    #chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
    .bubble{max-width:86%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;line-height:1.35}
    .bot{align-self:flex-start;background:var(--bot)}
    .driver{align-self:flex-end;background:var(--accent);color:#fff;font-weight:600}
    #input-bar{padding:10px 12px 16px;border-top:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;gap:8px;background:rgba(0,0,0,.9)}
    .error{color:#ff8d8d;font-size:.82rem}.hint{color:var(--muted);font-size:.8rem}
    .row{display:flex;gap:8px}
    .row input,.row textarea,select,textarea,.pin input,.form-grid input,.form-grid select,.form-grid textarea{flex:1;border:0;border-radius:14px;padding:12px;background:var(--field);color:var(--text);font-size:1rem;outline:0;font-family:inherit}
    .row button{border:0;border-radius:14px;padding:0 16px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
    .nums,.yesno{display:flex;gap:8px}
    .nums button,.yesno button{flex:1;border:0;border-radius:12px;padding:12px 0;background:var(--field);color:var(--text);font-weight:700;cursor:pointer}
    .panel-body{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
    .card{background:rgba(46,46,46,.9);border-radius:14px;padding:12px 14px}
    .card h3{margin:0 0 4px;font-size:1rem}.card p{margin:0;color:var(--muted);font-size:.85rem}
    .empty{color:var(--muted);text-align:center;margin-top:40px}
    .pin{width:100%;max-width:280px;display:flex;flex-direction:column;gap:10px}
    .filters{display:flex;gap:6px;padding:8px 12px;flex-wrap:wrap}
    .filters button{border:0;border-radius:10px;padding:8px 12px;background:var(--field);color:var(--text);font-weight:700;cursor:pointer;font-size:.85rem}
    .filters button.on{background:var(--accent);color:#fff}
    .table-wrap{flex:1;overflow:auto;padding:0 0 16px}
    table.admin{border-collapse:collapse;min-width:1800px;font-size:12px}
    table.admin th,table.admin td{border:1px solid rgba(255,255,255,.08);padding:8px 6px;text-align:left;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis}
    table.admin th{position:sticky;top:0;background:#1a1a1a;color:var(--accent);z-index:1}
    table.admin tr{cursor:pointer}
    table.admin tr:hover td{background:rgba(230,26,31,.12)}
    .form-grid{display:flex;flex-direction:column;gap:8px;width:100%;max-width:420px;margin:0 auto;padding:16px 16px 32px;text-align:left;overflow:auto;-webkit-overflow-scrolling:touch}
    .form-grid label{font-size:.8rem;color:var(--muted)}
    .form-grid input,.form-grid select,.form-grid textarea{width:100%}
    #admin-detail,#admin-create,#admin-catalogs-screen{overflow:auto}
    .calc{background:rgba(46,46,46,.9);border-radius:12px;padding:10px 12px;font-size:.9rem}
    .calc div{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
    .ok{color:#7dffa0;font-size:.85rem}
    .admin-cards{display:flex;flex-direction:column;gap:10px;padding:12px 16px 24px}
    .admin-cards .card button{margin-top:10px}
    .rate-missing{color:#ffb4b4;font-size:.82rem;font-weight:700}
  </style>
</head>
<body>
<div class="phone" id="shell">
  <div id="splash" class="screen show"><div class="center">
    <img class="logo" src="logo.png" alt="АРМАДА" />
    <div class="brand">АРМАДА</div>
    <div class="sub">Учёт перевозок</div>
  </div></div>

  <div id="roles" class="screen"><div class="center">
    <img class="logo" src="logo.png" alt="АРМАДА" />
    <div class="brand">АРМАДА</div>
    <div class="sub">Выберите роль</div>
    <div class="stack">
      <button class="primary" id="role-driver">Водитель</button>
      <button class="secondary" id="role-admin">Администратор</button>
    </div>
  </div></div>

  <div id="admin-pin" class="screen"><div class="center">
    <div class="sub" style="align-self:stretch;text-align:left"><button id="pin-back" style="background:0;border:0;color:var(--accent);font-weight:700">Назад</button></div>
    <h2 style="margin:0">Вход администратора</h2>
    <div class="sub">Введите PIN</div>
    <div class="pin">
      <input id="pin-input" inputmode="numeric" maxlength="8" placeholder="••••" />
      <div class="error" id="pin-error"></div>
      <button class="primary" id="pin-ok">Войти</button>
    </div>
  </div></div>

  <div id="admin" class="screen">
    <header>
      <button id="admin-exit">Выход</button>
      <h1>Таблица заявок</h1>
      <div>
        <button id="admin-catalogs">Справочники</button>
        <button id="admin-new">+ Заказ</button>
      </div>
    </header>
    <div class="filters" id="admin-filters">
      <button data-filter="all" class="on">Все</button>
      <button data-filter="assigned">Назначен</button>
      <button data-filter="progress">В работе</button>
      <button data-filter="closed">Закрыт</button>
    </div>
    <div class="table-wrap" id="admin-list"></div>
  </div>

  <div id="admin-create" class="screen">
    <div class="form-grid">
      <button id="create-back" class="secondary">Назад</button>
      <h2 style="margin:0">Назначить заказ</h2>
      <label>Номер за день</label>
      <div class="nums" id="create-day"><button data-cday="1">1</button><button data-cday="2">2</button><button data-cday="3">3</button><button data-cday="4">4</button><button data-cday="5">5</button></div>
      <label>Автомобиль</label>
      <select id="create-plate"></select>
      <label>Водитель</label>
      <select id="create-driver"></select>
      <label>Заказчик</label>
      <input id="create-customer" placeholder="Заказчик" />
      <label>Адрес загрузки</label>
      <textarea id="create-load" rows="2" placeholder="Адрес загрузки"></textarea>
      <label>Адрес выгрузки</label>
      <textarea id="create-unload" rows="2" placeholder="Адрес выгрузки"></textarea>
      <div class="error" id="create-error"></div>
      <button class="primary" id="create-save">Назначить водителю</button>
    </div>
  </div>

  <div id="admin-detail" class="screen">
    <div class="form-grid" id="detail-form"></div>
  </div>

  <div id="admin-catalogs-screen" class="screen">
    <div class="form-grid" id="catalogs-form"></div>
  </div>

  <div id="driver" class="screen">
    <header>
      <button id="driver-exit">Выход</button>
      <h1>Водитель</h1>
      <div>
        <button id="btn-cabinet">Кабинет</button>
        <button id="btn-orders">Заявки</button>
        <button id="btn-shifts">Смены</button>
      </div>
    </header>
    <div id="chat"></div>
    <div id="input-bar"></div>
    <div id="cabinet-panel" class="driver-panel">
      <header><button type="button" class="back-driver">← Назад</button><h1>Личный кабинет</h1><span></span></header>
      <div class="panel-body" id="cabinet-list"></div>
    </div>
    <div id="orders-panel" class="driver-panel">
      <header><button type="button" class="back-driver">← Назад</button><h1>Заявки</h1><span></span></header>
      <div class="panel-body" id="orders-list"></div>
    </div>
    <div id="shifts-panel" class="driver-panel">
      <header><button type="button" class="back-driver">← Назад</button><h1>Смены</h1><span></span></header>
      <div class="panel-body" id="shifts-list"></div>
    </div>
  </div>
</div>
<script>
const DEFAULT_VEHICLES=[{plate:"О 535 МВ 198",consumptionPer100Km:20},{plate:"М 277 НО 198",consumptionPer100Km:20}];
const DEFAULT_DRIVERS=[{name:"Наволоцкий Е.Н.",salaryPercent:30}];
const FLUIDS=["Максимум","Середина","Минимум"];
const DRIVER="Наволоцкий Е.Н.";
const ADMIN_PIN="2580";
const KEY="armada_app_v5";
const OLD_KEY="armada_app_v4";
const saved=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem(OLD_KEY)||"{}");
const DEFAULT_FINANCE={markupPercent:15};
const state={
  step:"idle", orderStep:"idle", messages:[], shift:null,
  shifts:saved.shifts||[], orders:saved.orders||[], seq:saved.seq||0,
  vehicles:saved.vehicles&&saved.vehicles.length?saved.vehicles:DEFAULT_VEHICLES.map(v=>({...v})),
  drivers:saved.drivers&&saved.drivers.length?saved.drivers:DEFAULT_DRIVERS.map(d=>({...d})),
  finance:Object.assign({}, DEFAULT_FINANCE, saved.finance||{}),
  light:{}, draft:{}, error:"", adminFilter:"all", detailId:null
};
if(!(state.finance.markupPercent>=0)) state.finance.markupPercent=15;
if(state.finance.markupPercent>80) state.finance.markupPercent=80;
if(!state.orders.length && state.shifts.length){ state.orders = state.shifts.flatMap(s => s.orders||[]); }
state.orders.forEach(o=>{ if(o.customer==null) o.customer=""; if(o.driverPercent==null) o.driverPercent=driverPercent(o.driverName||DRIVER); });
const $ = id => document.getElementById(id);
function show(id){
  document.querySelectorAll('.phone > .screen').forEach(s=>s.classList.remove('show'));
  $(id).classList.add('show');
  const wide = id==='admin'||id==='admin-detail'||id==='admin-create'||id==='admin-catalogs-screen';
  $('shell').classList.toggle('wide', wide);
}
function persist(){ localStorage.setItem(KEY, JSON.stringify({shifts:state.shifts, orders:state.orders, seq:state.seq, vehicles:state.vehicles, drivers:state.drivers, finance:state.finance})); }
function upsertShift(){ if(!state.shift) return; state.shift.messages=state.messages.slice(); const i=state.shifts.findIndex(s=>s.id===state.shift.id); if(i>=0) state.shifts[i]=structuredClone(state.shift); else state.shifts.unshift(structuredClone(state.shift)); persist(); }
function timeNow(){ return new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}); }
function dateTime(d){ return new Date(d).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function esc(s){ return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'); }
function add(a,t){ state.messages.push({author:a,text:t}); renderChat(); }
function plates(){ return state.vehicles.map(v=>v.plate); }
function vehicle(plate){ return state.vehicles.find(v=>v.plate===plate)||{plate,consumptionPer100Km:20}; }
function driverPercent(name){ return (state.drivers.find(d=>d.name===name)||{salaryPercent:30}).salaryPercent; }
function round2(v){ return Math.round(v*100)/100; }
function fmt(v){ if(v==null||v==='') return '—'; const n=+v; if(Number.isNaN(n)) return String(v); return n===Math.round(n)?String(Math.round(n)):n.toFixed(2); }
function hasOpenOrder(){ return !!inProgressOrder(); }
function inProgressOrder(){ return (state.orders||[]).find(o=>!o.closedAt && o.startOdometer!=null) || null; }
function assignedPending(){ return (state.orders||[]).filter(o=>!o.closedAt && o.startOdometer==null && o.driverName===DRIVER); }
function upsertOrder(order){
  const i=state.orders.findIndex(o=>o.id===order.id);
  if(i>=0) state.orders[i]=order; else state.orders.unshift(order);
  state.shifts.forEach(s=>{ const j=(s.orders||[]).findIndex(o=>o.id===order.id); if(j>=0) s.orders[j]=order; });
  persist();
}
function openOrder(){ return inProgressOrder(); }
function allOrders(){ return (state.orders||[]).slice().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)); }
function statusText(o){ if(o.closedAt) return 'Закрыт'; if(o.startOdometer!=null) return 'В работе'; return 'Назначен'; }
function dayTotal(o){ if(o.emptyKmBefore==null && o.loadedKm==null && o.emptyKmAfter==null) return null; return (o.emptyKmBefore||0)+(o.loadedKm||0)+(o.emptyKmAfter||0); }
function kmParkingToEnd(o){
  if(o.endOdometer!=null && o.previousOdometer!=null) return Math.max(0, o.endOdometer-o.previousOdometer);
  if(o.emptyKmBefore!=null || o.loadedKm!=null) return (o.emptyKmBefore||0)+(o.loadedKm||0);
  return null;
}
function selectedRate(o){
  if(o.paymentForm==='withVat') return o.rateWithVat??null;
  if(o.paymentForm==='withoutVat') return o.rateWithoutVat??null;
  if(o.paymentForm==='cash') return o.rateCash??null;
  return o.freight??null;
}
const VAT_MARKUP=0.22;   // с НДС = без НДС + 22%
const CASH_DISCOUNT=0.08; // нал = без НДС − 8%
function fillRatesFrom(form, amount){
  let without;
  if(form==='withoutVat') without=amount;
  else if(form==='withVat') without=amount/(1+VAT_MARKUP);
  else without=amount/(1-CASH_DISCOUNT);
  return {
    withVat: round2(without*(1+VAT_MARKUP)),
    withoutVat: round2(without),
    cash: round2(without*(1-CASH_DISCOUNT))
  };
}
function wireRateAutoFill(){
  const map={ 'd-vat':'withVat', 'd-novat':'withoutVat', 'd-cash':'cash' };
  Object.keys(map).forEach(id=>{
    const el=$(id); if(!el) return;
    el.oninput=()=>{
      const raw=(el.value||'').trim().replace(',','.');
      const amount=+raw; if(!(amount>0)) return;
      const form=map[id];
      const t=fillRatesFrom(form, amount);
      $('d-form').value=form;
      if(id!=='d-vat') $('d-vat').value=String(t.withVat);
      if(id!=='d-novat') $('d-novat').value=String(t.withoutVat);
      if(id!=='d-cash') $('d-cash').value=String(t.cash);
    };
  });
}
function variableShare(driverPercent){ return driverPercent/100 + 0.10; }
function fixedCosts(fuelCost, rent, bonus){ return (fuelCost||0)+(rent||0)+(bonus||0); }
function breakEvenRate(fixed, driverPercent){
  const den=1-variableShare(driverPercent);
  if(den<=0.01) return null;
  return round2(fixed/den);
}
function recommendedRate(fixed, driverPercent, markupPercent){
  const den=1-variableShare(driverPercent)-(markupPercent||0)/100;
  if(den<=0.01) return null;
  return round2(fixed/den);
}
function totalCostAtRate(rate, fuelCost, rent, driverPercent, bonus){
  const pay=rate*driverPercent/100+bonus;
  const cush=rate*0.1;
  return round2((fuelCost||0)+rent+pay+cush);
}
function metrics(o){
  const cons=vehicle(o.vehiclePlate).consumptionPer100Km;
  const km=kmParkingToEnd(o);
  const fuelLitersCalc=km==null?null:round2(km*cons/100);
  const price=o.fuelPricePerLiter;
  const fuelCostCalc=(fuelLitersCalc!=null && price!=null)?round2(fuelLitersCalc*price):(o.fuelTotalCost??null);
  const rate=selectedRate(o);
  const cushion=rate==null?null:round2(rate*0.1);
  const bonus=o.salaryBonus||0;
  const percent=o.driverPercent??driverPercent(o.driverName||DRIVER);
  const driverPay=rate==null?null:round2(rate*percent/100+bonus);
  const rent=o.vehicleRent||0;
  const fuel=fuelCostCalc||0;
  const fixed=round2(fixedCosts(fuel, rent, bonus));
  const markup=state.finance.markupPercent??15;
  const be=breakEvenRate(fixed, percent);
  const rec=recommendedRate(fixed, percent, markup);
  const totalCost=rate==null?null:totalCostAtRate(rate, fuel, rent, percent, bonus);
  const netProfit=(rate!=null && driverPay!=null && cushion!=null)?round2(rate-driverPay-cushion-fuel-rent):null;
  const costPerKmNoVat=(o.rateWithoutVat!=null && o.loadedKm>0)?round2(o.rateWithoutVat/o.loadedKm):null;
  return {km,fuelLitersCalc,fuelCostCalc,rate,cushion,driverPay,costPerKmNoVat,netProfit,cons,percent,fixedCosts:fixed,totalCost,breakEvenRate:be,recommendedRate:rec,markupPercent:markup};
}

function renderChat(){
  $('chat').innerHTML=state.messages.map(m=>`<div class="bubble ${m.author}">${esc(m.text)}</div>`).join('');
  $('chat').scrollTop=$('chat').scrollHeight; renderInput();
}
function fluidButtons(){ return FLUIDS.map(l=>`<button class="secondary fluid" data-level="${l}">${l}</button>`).join(''); }
function lightsUI(){
  const rows=[["lowBeam","Ближний свет"],["brake","Стоп-сигналы"],["turn","Указатели поворотов"]];
  return rows.map(([k,t])=>`<div><div class="hint">${t}</div><div class="yesno">
    <button data-key="${k}" data-val="Да" class="${state.light[k]==='Да'?'primary':''}">Да</button>
    <button data-key="${k}" data-val="Нет" class="${state.light[k]==='Нет'?'primary':''}">Нет</button></div></div>`).join('')+`<button class="primary" id="lights-ok">Отправить</button>`;
}
function renderInput(){
  const err=state.error?`<div class="error">${esc(state.error)}</div>`:'';
  let html=err; const os=state.orderStep;
  if(os==='chooseVehicle') html+=plates().map(p=>`<button class="secondary plate" data-plate="${esc(p)}">${esc(p)}</button>`).join('');
  else if(os==='arrivalOdometer'||os==='closingOdometer'||os==='fuelPrice'||os==='fuelAmount'||os==='startAssignedOdometer'||os==='closeShiftParking'){
    const ph=os==='fuelPrice'?'Например, 56.5':os==='fuelAmount'?'Например, 40':os==='closeShiftParking'?'Например, 277800':os==='closingOdometer'?'Например, 277720':'Например, 277690';
    html+=`<div class="row"><input id="num" inputmode="decimal" placeholder="${ph}" /><button id="num-ok">OK</button></div>`;
  } else if(os==='dayNumber') html+=`<div class="hint">Номер заказа за день</div><div class="nums">${[1,2,3,4,5].map(n=>`<button data-day="${n}">${n}</button>`).join('')}</div>`;
  else if(os==='loading'||os==='unloading') html+=`<div class="row"><textarea id="text" rows="2" placeholder="Город, улица, дом, строение"></textarea><button id="text-ok">OK</button></div>`;
  else if(os==='askRefuel') html+=`<div class="yesno"><button id="refuel-yes">Да</button><button id="refuel-no">Нет</button></div>`;
  else if(state.step==='idle') html+=`<button class="primary" id="open-shift">Открыть смену</button>`;
  else if(state.step==='chooseVehicle') html+=plates().map(p=>`<button class="secondary plate" data-plate="${esc(p)}">${esc(p)}</button>`).join('');
  else if(state.step==='odometer'||state.step==='fuel') html+=`<div class="row"><input id="num" inputmode="decimal" placeholder="${state.step==='odometer'?'Например, 125430':'Например, 42'}" /><button id="num-ok">OK</button></div>`;
  else if(state.step==='gur') html+=`<div class="hint">Уровень жидкости ГУР</div>`+fluidButtons();
  else if(state.step==='coolant') html+=`<div class="hint">Уровень ОЖ</div>`+fluidButtons();
  else if(state.step==='lights') html+=lightsUI();
  else if(state.step==='oil') html+=`<div class="hint">Уровень масла в ДВС</div>`+fluidButtons();
  else if(state.step==='done'){
    if(hasOpenOrder()) html+=`<button class="primary" id="close-order">Закрыть заказ</button>`;
    else {
      assignedPending().forEach(o=>{ html+=`<button class="primary start-assigned" data-id="${o.id}">Начать заказ №${o.sequentialNumber}</button>`; });
      html+=`<button class="secondary" id="create-order">Создать заказ сам</button>`;
      html+=`<button class="primary" id="close-shift">Закрыть смену</button>`;
    }
    if(!findOpenShift()) html+=`<button class="secondary" id="new-shift">Новая смена</button>`;
  }
  $('input-bar').innerHTML=html; wireInput();
}
function wireInput(){
  $('open-shift')&&($('open-shift').onclick=openShift);
  document.querySelectorAll('.plate').forEach(b=>b.onclick=()=>selectVehicle(b.dataset.plate));
  $('num-ok')&&($('num-ok').onclick=submitNumber);
  document.querySelectorAll('.fluid').forEach(b=>b.onclick=()=>selectFluid(b.dataset.level));
  document.querySelectorAll('.yesno button[data-key]').forEach(b=>b.onclick=()=>{state.light[b.dataset.key]=b.dataset.val;state.error='';renderInput();});
  $('lights-ok')&&($('lights-ok').onclick=submitLights);
  $('create-order')&&($('create-order').onclick=startCreateOrder);

function findOpenShift(){ return (state.shifts||[]).slice().sort((a,b)=>new Date(b.startedAt)-new Date(a.startedAt)).find(s=>!s.endedAt) || null; }
function isEtoDone(shift){
  if(shift.completedAt) return true;
  return !!(shift.vehiclePlate && shift.odometer!=null && shift.fuelLiters!=null && (shift.gur||shift.powerSteeringLevel) && (shift.coolant||shift.coolantLevel) && (shift.oil||shift.engineOilLevel));

function resumeOpenShift(shift){
  state.shift=shift;
  state.messages=(shift.messages&&shift.messages.length)?shift.messages.slice():[];
  state.orderStep='idle'; state.draft={}; state.error=''; state.light=shift.light||{};
  if(isEtoDone(shift)){
    state.step='done';
    const noted=(state.messages||[]).some(m=>String(m.text||'').includes('Смена уже открыта')||String(m.text||'').includes('Продолжаем открытую смену'));
    if(!state.messages.length){
      state.messages=[{author:'bot',text:`Продолжаем открытую смену от ${dateTime(shift.startedAt)}.`}];
    } else if(!noted){
      state.messages.push({author:'bot',text:`Смена уже открыта (${shift.vehiclePlate||'авто'}). ЕТО пройден — можно работать с заказами или закрыть смену.`});
    }
    upsertShift(); persist(); renderChat(); return;
  }
  if(!shift.vehiclePlate) state.step='chooseVehicle';
  else if(shift.odometer==null) state.step='odometer';
  else if(shift.fuelLiters==null) state.step='fuel';
  else if(!(shift.gur||shift.powerSteeringLevel)) state.step='gur';
  else if(!(shift.coolant||shift.coolantLevel)) state.step='coolant';
  else if(!state.light.lowBeam || !state.light.brake || !state.light.turn) state.step='lights';
  else state.step='oil';
  if(!state.messages.length){
    state.messages=[{author:'bot',text:'Смена открыта, но ЕТО не завершён. Продолжим с того места, где остановились.'}];

function openShift(){

function submitNumber(){

    if(value<prev){state.error=`Одометр не может быть меньше предыдущего (${prev})`;renderInput();return;}
    state.draft.startOdo=value; state.draft.prevOdo=prev; add('driver',String(value));

    state.shift.fuelLiters=value;
    add('driver',`${value} л`);
    add('bot','Проверьте и укажите уровень жидкости ГУР:\n• Максимум\n• Середина\n• Минимум'); state.step='gur';

}

function beginAssigned(id){
  if(hasOpenOrder()){ state.error='Сначала закройте текущий заказ'; renderInput(); return; }
  const order=state.orders.find(o=>o.id===id); if(!order||order.startOdometer!=null){ state.error='Заказ недоступен'; renderInput(); return; }
  state.draft.assignedId=id; add('driver',`Начать заказ №${order.sequentialNumber}`);
  add('bot',`Заказ №${order.sequentialNumber} (день ${order.dayNumber})\nАвто: ${order.vehiclePlate}\nМаршрут: ${order.loadingAddress} — ${order.unloadingAddress}\nУкажите показания одометра по прибытию на загрузку.`);

function acceptStartAssigned(value){
  const order=state.orders.find(o=>o.id===state.draft.assignedId); if(!order){ state.error='Заказ не найден'; renderInput(); return; }
  const prev=state.shift.lastOdometerPoint??state.shift.odometer;

  if(value<prev){ state.error=`Одометр не может быть меньше предыдущего (${prev})`; renderInput(); return; }

  if(!state.shift.orders) state.shift.orders=[];
  if(!state.shift.orders.some(o=>o.id===order.id)) state.shift.orders.push(order);
  upsertOrder(order); add('driver',String(value));
  add('bot',`Заявка в работе🔔\n\n№${order.sequentialNumber} · день ${order.dayNumber}\n${order.loadingAddress} — ${order.unloadingAddress}\nОдометр: ${value}`);

function startCreateOrder(){

function startCloseShift(){

function acceptCloseShiftParking(value){
  const prev=state.shift.lastOdometerPoint??state.shift.odometer;
  if(prev!=null && value<prev){ state.error=`Одометр не может быть меньше предыдущего (${prev})`; renderInput(); return; }
  add('driver',String(value));
  const closed=(state.shift.orders||[]).filter(o=>o.closedAt && o.endOdometer!=null)
    .sort((a,b)=>new Date(a.closedAt)-new Date(b.closedAt));

    last.emptyKmAfter=Math.max(0, value-last.endOdometer);

  state.shift.lastOdometerPoint=value;

function answerRefuel(yes){

function finalizeClose(refueled,price,liters){

  order.endOdometer=end; order.loadedKm=loaded; order.refueled=refueled; order.closedAt=new Date().toISOString();
  if(refueled){ order.fuelPricePerLiter=price; order.fuelLiters=liters; order.fuelTotalCost=round2(price*liters); }
  if(state.shift) state.shift.lastOdometerPoint=end;
  upsertOrder(order);
  add('bot',`Заказ №${order.sequentialNumber} закрыт.\nОдометр окончания: ${end}\nЗП по заказу появится в «Заявки» после расчёта администратором.`);

  const rows=orders.map(o=>{
    const m=metrics(o);
    const cells=[dateTime(o.createdAt), o.vehiclePlate, o.driverName, o.customer||'—', `${o.loadingAddress} — ${o.unloadingAddress}`, o.dayNumber, fmt(o.emptyKmBefore), fmt(o.loadedKm), fmt(o.emptyKmAfter), fmt(dayTotal(o)), fmt(o.fuelPricePerLiter), fmt(o.rateWithVat), fmt(o.rateWithoutVat), fmt(o.rateCash), fmt(o.salaryBonus), fmt(m.fuelLitersCalc), fmt(m.costPerKmNoVat), fmt(m.fuelCostCalc), fmt(o.vehicleRent), fmt(m.cushion), fmt(m.netProfit), o.sequentialNumber];
    return `<tr data-id="${o.id}"><td><button type="button" class="open-rates" data-id="${o.id}" style="background:var(--accent);color:#fff;border:0;border-radius:8px;padding:6px 8px;font-weight:700;cursor:pointer">Ставки</button></td>${cells.map(v=>`<td title="${esc(v)}">${esc(v)}</td>`).join('')}</tr>`;
  }).join('');
  $('admin-list').innerHTML=`
    <div class="hint" style="padding:8px 16px 0">Карточка заявки → поля ставок, доплаты, аренды. После «Сохранить» считается ЗП водителя.</div>
    <div class="admin-cards">${cards}</div>
    <div class="hint" style="padding:0 16px">Широкая таблица (горизонтальный скролл)</div>
    <div class="table-wrap" style="padding:8px 0 24px"><table class="admin"><thead><tr><th></th>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
  document.querySelectorAll('#admin-list .open-rates').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); openDetail(b.dataset.id); });
  document.querySelectorAll('#admin-list tr[data-id]').forEach(tr=>tr.onclick=()=>openDetail(tr.dataset.id));
}
function fillCreateSelects(){
  $('create-plate').innerHTML=state.vehicles.map(v=>`<option>${esc(v.plate)}</option>`).join('');
  $('create-driver').innerHTML=state.drivers.map(d=>`<option>${esc(d.name)}</option>`).join('');
}
let createDay=1;
function bindAdminCreate(){
  $('admin-new').onclick=()=>{ createDay=1; $('create-error').textContent=''; $('create-customer').value=''; $('create-load').value=''; $('create-unload').value=''; fillCreateSelects(); show('admin-create'); highlightDay(); };
  $('create-back').onclick=()=>{ show('admin'); renderAdmin(); };
  document.querySelectorAll('[data-cday]').forEach(b=>b.onclick=()=>{ createDay=+b.dataset.cday; highlightDay(); });
  $('create-save').onclick=saveDispatcherOrder;
}
function highlightDay(){ document.querySelectorAll('[data-cday]').forEach(b=>{ b.style.background = (+b.dataset.cday===createDay)?'var(--accent)':'var(--field)'; }); }
function saveDispatcherOrder(){
  const load=($('create-load').value||'').trim(); const unload=($('create-unload').value||'').trim();
  const plate=$('create-plate').value; const driver=($('create-driver').value||DRIVER).trim();
  const customer=($('create-customer').value||'').trim();
  if(!load||!unload){ $('create-error').textContent='Заполните оба адреса'; return; }
  state.seq+=1;
  const order={id:crypto.randomUUID(),sequentialNumber:state.seq,dayNumber:createDay,createdAt:new Date().toISOString(),source:'dispatcher',vehiclePlate:plate,driverName:driver,customer,loadingAddress:load,unloadingAddress:unload,startOdometer:null,driverPercent:driverPercent(driver)};
  upsertOrder(order); show('admin'); renderAdmin();
}
function openDetail(id){
  state.detailId=id;
  const o=state.orders.find(x=>x.id===id); if(!o) return;
  const m=metrics(o);
  $('detail-form').innerHTML=`
    <button class="secondary" id="detail-back">← Назад</button>
    <h2 style="margin:0">Заявка №${o.sequentialNumber}</h2>
    <div class="hint">${statusText(o)} · день ${o.dayNumber} · ${esc(o.driverName)} (${m.percent}%)</div>
    <div class="hint" style="color:var(--accent)">Введите сумму в одно поле ставки — два других заполнятся сами (с НДС = без НДС +22%, нал = без НДС −8%).</div>
    <label>Заказчик</label><input id="d-customer" value="${esc(o.customer||'')}" placeholder="Название заказчика" />
    <label>Маршрут</label><div class="calc">${esc(o.loadingAddress)} — ${esc(o.unloadingAddress)}</div>
    <label>Пробег до стоянки, км</label><input id="d-empty-after" inputmode="numeric" value="${o.emptyKmAfter??''}" placeholder="например 40" />
    <label>Форма оплаты (какая ставка в расчётах ЗП/прибыли)</label>
    <select id="d-form">
      <option value="withVat" ${o.paymentForm==='withVat'||!o.paymentForm?'selected':''}>С НДС</option>
      <option value="withoutVat" ${o.paymentForm==='withoutVat'?'selected':''}>Без НДС</option>
      <option value="cash" ${o.paymentForm==='cash'?'selected':''}>Наличные</option>
    </select>
    <label>Ставка с НДС, ₽</label><input id="d-vat" inputmode="decimal" value="${o.rateWithVat??''}" placeholder="введите сюда или в другое поле" />
    <label>Ставка без НДС, ₽</label><input id="d-novat" inputmode="decimal" value="${o.rateWithoutVat??''}" placeholder="введите сюда или в другое поле" />
    <label>Ставка наличные, ₽</label><input id="d-cash" inputmode="decimal" value="${o.rateCash??''}" placeholder="введите сюда или в другое поле" />
    <label>Доплата к ЗП, ₽</label><input id="d-bonus" inputmode="decimal" value="${o.salaryBonus??''}" placeholder="0" />
    <label>Аренда ТС, ₽</label><input id="d-rent" inputmode="decimal" value="${o.vehicleRent??''}" placeholder="0" />
    <button class="primary" id="detail-save">Сохранить ставки</button>
    <div class="ok" id="detail-ok" style="display:none">Сохранено — ЗП водителя пересчитана</div>
    <div class="calc">
      <div><span>Нулевой</span><span>${fmt(o.emptyKmBefore)} км</span></div>
      <div><span>С грузом</span><span>${fmt(o.loadedKm)} км</span></div>
      <div><span>От стоянки до конца</span><span>${fmt(m.km)} км</span></div>
      <div><span>Норма авто</span><span>${fmt(m.cons)} л/100</span></div>
      <div><span>ГСМ по заказу</span><span>${fmt(m.fuelLitersCalc)} л</span></div>
      <div><span>₽/л (факт)</span><span>${fmt(o.fuelPricePerLiter)}</span></div>
      <div><span>Стоимость ГСМ</span><span>${fmt(m.fuelCostCalc)} ₽</span></div>
      <div><span>₽/км без НДС</span><span>${fmt(m.costPerKmNoVat)}</span></div>
      <div><span>Подушка 10%</span><span>${fmt(m.cushion)} ₽</span></div>
      <div><span>ЗП водителя</span><span>${fmt(m.driverPay)} ₽</span></div>
      <div><span>Чистая прибыль</span><span>${fmt(m.netProfit)} ₽</span></div>
      <div style="margin-top:8px;opacity:.7;font-size:12px">Себестоимость / ставка</div>
      <div><span>Себестоимость (фикс)</span><span>${fmt(m.fixedCosts)} ₽</span></div>
      <div><span>Полная себестоимость</span><span>${fmt(m.totalCost)} ₽</span></div>
      <div><span>Безубыток</span><span>${fmt(m.breakEvenRate)} ₽</span></div>
      <div><span>Рекомендация +${Math.round(m.markupPercent)}%</span><span>${fmt(m.recommendedRate)} ₽</span></div>
    </div>
  `;
  show('admin-detail');
  $('admin-detail').scrollTop=0;
  wireRateAutoFill();
  $('detail-back').onclick=()=>{ show('admin'); renderAdmin(); };
  $('detail-save').onclick=()=>{
    const order=state.orders.find(x=>x.id===id); if(!order) return;
    const num=el=>{ const v=($(el).value||'').trim().replace(',','.'); return v===''?null:Number(v); };
    order.customer=($('d-customer').value||'').trim();
    const after=($('d-empty-after').value||'').replace(/\D/g,'');
    order.emptyKmAfter=after?+after:null;
    order.paymentForm=$('d-form').value;
    // на всякий случай пересчитать триаду от выбранной формы, если там есть число
    const form=order.paymentForm;
    const seed = form==='withVat'?num('d-vat'):form==='cash'?num('d-cash'):num('d-novat');
    if(seed!=null && seed>0){
      const t=fillRatesFrom(form, seed);
      order.rateWithVat=t.withVat; order.rateWithoutVat=t.withoutVat; order.rateCash=t.cash;
    } else {
      order.rateWithVat=num('d-vat'); order.rateWithoutVat=num('d-novat'); order.rateCash=num('d-cash');
    }
    order.salaryBonus=num('d-bonus'); order.vehicleRent=num('d-rent');
    order.freight=selectedRate(order);
    const pay=metrics(order).driverPay; order.earnings=pay!=null?pay:null;
    upsertOrder(order);
    openDetail(id);
    $('detail-ok').style.display='block';
  };
}
function openCatalogs(){
  $('catalogs-form').innerHTML=`
    <button class="secondary" id="cat-back">Назад</button>
    <h2 style="margin:0">Справочники</h2>
    <h3 style="margin:8px 0 0">Финансы</h3>
    <label>Наценка к себестоимости, % (по умолчанию 15)</label>
    <div class="row"><input id="fin-markup" inputmode="decimal" value="${state.finance.markupPercent??15}" /><button id="fin-save">OK</button></div>
    <div class="hint">Рекомендуемая ставка = фикс / (1 − %ЗП − подушка 10% − наценка). Диапазон 0–80.</div>
    <h3 style="margin:8px 0 0">Авто (л/100 км)</h3>
    ${state.vehicles.map((v,i)=>`<label>${esc(v.plate)}</label><div class="row"><input id="veh-${i}" inputmode="decimal" value="${v.consumptionPer100Km}" /><button data-save-veh="${i}">OK</button></div>`).join('')}
    <h3 style="margin:8px 0 0">Водители (% от ставки)</h3>
    ${state.drivers.map((d,i)=>`<label>${esc(d.name)}</label><div class="row"><input id="drv-${i}" inputmode="decimal" value="${d.salaryPercent}" /><button data-save-drv="${i}">OK</button></div>`).join('')}
    <div class="ok" id="cat-ok" style="display:none">Сохранено</div>
  `;
  show('admin-catalogs-screen');
  $('cat-back').onclick=()=>{ show('admin'); renderAdmin(); };
  $('fin-save').onclick=()=>{
    let v=+(($('fin-markup').value||'').replace(',','.'));
    if(Number.isNaN(v)) return;
    v=Math.min(80, Math.max(0, v));
    state.finance.markupPercent=v;
    $('fin-markup').value=String(v);
    persist();
    $('cat-ok').style.display='block';
  };
  document.querySelectorAll('[data-save-veh]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.saveVeh; const v=+(($('veh-'+i).value||'').replace(',','.')); if(!(v>0)) return; state.vehicles[i].consumptionPer100Km=v; persist(); $('cat-ok').style.display='block'; });
  document.querySelectorAll('[data-save-drv]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.saveDrv; const v=+(($('drv-'+i).value||'').replace(',','.')); if(!(v>=0)) return; state.drivers[i].salaryPercent=v; state.orders.filter(o=>o.driverName===state.drivers[i].name).forEach(o=>{ o.driverPercent=v; }); persist(); $('cat-ok').style.display='block'; });
}

setTimeout(()=>{ show('roles'); }, 1600);
$('role-driver').onclick=()=>{ show('driver'); resetChat(); };
$('role-admin').onclick=()=>{ $('pin-input').value=''; $('pin-error').textContent=''; show('admin-pin'); };
$('pin-back').onclick=()=>show('roles');
$('pin-ok').onclick=()=>{ if(($('pin-input').value||'').trim()===ADMIN_PIN){ show('admin'); renderAdmin(); } else $('pin-error').textContent='Неверный PIN'; };
$('admin-exit').onclick=()=>show('roles');
$('admin-catalogs').onclick=openCatalogs;
$('driver-exit').onclick=()=>show('roles');
$('btn-cabinet').onclick=showCabinet;
$('btn-orders').onclick=showOrders;
$('btn-shifts').onclick=showShifts;
document.querySelectorAll('.back-driver').forEach(b=>{
  b.onclick=(e)=>{ e.preventDefault(); e.stopPropagation(); hideDriverPanels(); };
});
document.querySelectorAll('#admin-filters button').forEach(b=>b.onclick=()=>{ state.adminFilter=b.dataset.filter; document.querySelectorAll('#admin-filters button').forEach(x=>x.classList.toggle('on', x===b)); renderAdmin(); });
bindAdminCreate();
</script>
</body>
</html>
